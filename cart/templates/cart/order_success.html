<!DOCTYPE html>
<html>
<head>
    <title>Order Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 50px;
        }

        .success-box {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .success-icon {
            font-size: 60px;
        }

        h1 {
            color: #16a34a;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="success-icon">✅</div>

    <h1>Order Placed Successfully!</h1>

    <p>Thank you for your order.</p>

    <p>Your order has been received successfully.</p>

    <a href="/" class="btn">
        Continue Shopping
    </a>

</div>

</body>
</html>
